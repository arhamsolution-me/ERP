apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexerp-ingress
  namespace: nexerp
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - "nexerp.app"
        - "*.nexerp.app"
      secretName: nexerp-tls-secret
  rules:
    - host: "api.nexerp.app"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexerp-api-svc
                port:
                  number: 3001
    - host: "nexerp.app"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexerp-web-svc
                port:
                  number: 3000
